name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-gate:
    name: Quality & Verification Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build embedded application UI
        working-directory: crates/agmux-cli/src/companion_gui/ui
        run: npm ci && npm run build && npm run test:state

      - name: Run .soul V-Cycle Traceability Check
        run: node .soul/tools/v-cycle-checker.mjs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Debug Binaries for Integration Tests
        run: cargo build --workspace --bins

      - name: Run Test Suites (cargo test)
        run: cargo test --workspace --verbose

  build-executables:
    name: Build (${{ matrix.platform.name }})
    needs: quality-gate
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            artifact_slug: agmux-linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_name: agmux-linux-x86_64.tar.gz
          - name: Windows x86_64
            artifact_slug: agmux-windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: agmux-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js for embedded UI
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build embedded application UI
        working-directory: crates/agmux-cli/src/companion_gui/ui
        run: npm ci && npm run build

      - name: Install musl toolchain (Linux)
        if: matrix.platform.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Build Release Executables
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --workspace --bins --target ${{ matrix.platform.target }}

      - name: Package Linux Binaries
        if: runner.os == 'Linux'
        run: |
          cd target/${{ matrix.platform.target }}/release
          file agmux agmuxd
          strip agmux agmuxd
          tar -czvf ../../../${{ matrix.platform.archive_name }} agmux agmuxd
          cd ../../..
          sha256sum ${{ matrix.platform.archive_name }} > ${{ matrix.platform.archive_name }}.sha256

      - name: Verify standalone Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory $root | Out-Null
          Copy-Item "target/${{ matrix.platform.target }}/release/agmux.exe", "target/${{ matrix.platform.target }}/release/agmuxd.exe" $root
          $env:AGMUX_GUI_NO_OPEN = '1'
          $env:AGMUX_SOCK = Join-Path $root 'socket'
          $env:AGMUX_AUTH_TOKEN_PATH = Join-Path $root 'token'
          $env:AGMUX_DB_PATH = Join-Path $root 'state.db'
          $env:AGMUX_CONFIG_PATH = Join-Path $root 'config'
          Remove-Item Env:AGMUX_UI_DIST -ErrorAction SilentlyContinue
          $app = Start-Process (Join-Path $root 'agmux.exe') -WorkingDirectory $root -PassThru -RedirectStandardOutput (Join-Path $root 'stdout') -RedirectStandardError (Join-Path $root 'stderr')
          try {
            $url = $null
            for ($attempt = 0; $attempt -lt 100; $attempt++) {
              if ($app.HasExited) { throw (Get-Content (Join-Path $root 'stderr') -Raw) }
              $url = Get-Content (Join-Path $root 'stdout') -ErrorAction SilentlyContinue | Where-Object { $_ -match '^http://127[.]0[.]0[.]1:[0-9]+/$' } | Select-Object -First 1
              if ($url) { break }
              Start-Sleep -Milliseconds 100
            }
            if (!$url) { throw 'Application did not start its companion server' }
            $html = (Invoke-WebRequest $url).Content
            if ($html -notmatch "const token='([a-f0-9]+)'") { throw 'Live application bootstrap missing' }
            $headers = @{ 'X-Agmux-Token' = $Matches[1] }
            $snapshot = Invoke-RestMethod ($url + 'api/snapshot') -Headers $headers
            $assets = [regex]::Matches($html, '(?:src|href)="(/assets/[^"]+)"')
            if ($assets.Count -eq 0) { throw 'Embedded frontend assets missing' }
            foreach ($asset in $assets) {
              $response = Invoke-WebRequest ($url.TrimEnd('/') + $asset.Groups[1].Value)
              if ($response.StatusCode -ne 200) { throw 'Embedded asset failed to load' }
            }
            Write-Output 'Standalone agmux.exe launched its embedded live UI and connected to agmuxd.exe.'
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Get-Process agmuxd -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $root 'agmuxd.exe') } | Stop-Process -Force
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Package Windows Binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "${{ matrix.platform.archive_name }}"
          Compress-Archive -Path "target/${{ matrix.platform.target }}/release/agmux.exe", "target/${{ matrix.platform.target }}/release/agmuxd.exe" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

      - name: Upload Executable Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.artifact_slug }}
          path: |
            ${{ matrix.platform.archive_name }}
            ${{ matrix.platform.archive_name }}.sha256
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: build-executables
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded release assets
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/agmux-linux-x86_64.tar.gz
            release-assets/agmux-linux-x86_64.tar.gz.sha256
            release-assets/agmux-windows-x86_64.zip
            release-assets/agmux-windows-x86_64.zip.sha256
          generate_release_notes: true
