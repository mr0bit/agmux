[workspace]
resolver = "3"
members = [
    "crates/agmux-proto",
    "crates/agmux-core",
    "crates/agmux-daemon",
    "crates/agmux-tui",
    "crates/agmux-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
portable-pty = "0.9"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }

[package]
name = "agmux-verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dev-dependencies]
agmux-core = { path = "crates/agmux-core" }
agmux-daemon = { path = "crates/agmux-daemon" }
agmux-cli = { path = "crates/agmux-cli" }
agmux-tui = { path = "crates/agmux-tui" }
ratatui = "0.28.1"
crossterm = "0.28.1"
serde_json.workspace = true
agmux-proto = { path = "crates/agmux-proto" }
tokio.workspace = true
futures-util.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
libc.workspace = true
zstd = "0.14"

[lints.clippy]
zombie_processes = "allow"
